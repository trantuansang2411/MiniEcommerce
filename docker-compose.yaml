services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: miniproject-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Pass123"

    ports:
      - "1433:1433"

    volumes:
      - miniproject_sqlserver_data:/var/opt/mssql

volumes:
  miniproject_sqlserver_data: